<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spelling Bee Contest</title>

<style>
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:linear-gradient(180deg,#fff8dc,#ffe680);
text-align:center;
margin:0;
padding:20px;
}

h1{
color:#b8860b;
}

#word{
font-size:48px;
font-weight:bold;
margin:20px;
}

button{
font-size:18px;
padding:12px 20px;
margin:5px;
border-radius:10px;
border:none;
background:#ffd54f;
}

button:active{
transform:scale(0.95);
}

.active{
outline:4px solid green;
}

.score{
font-size:22px;
margin:10px;
}
</style>

</head>
<body>

<h1>Spelling Bee Contest</h1>

<div>
<input id="player1" placeholder="Player 1" value="Player 1">
<input id="player2" placeholder="Player 2" value="Player 2">
</div>

<div class="score" id="score1">Player 1: 0</div>
<div class="score" id="score2">Player 2: 0</div>

<div id="word">Press SPIN</div>

<button onclick="spin()">SPIN</button>
<button onclick="playAudio()">PLAY AUDIO</button>
<button onclick="correct()">CORRECT</button>
<button onclick="incorrect()">INCORRECT</button>
<button onclick="nextPlayer()">NEXT PLAYER</button>
<button onclick="reset()">RESET</button>

<script>

const words = [
"about","action","address","alike","animal","around","attic","away","baby","bake",
"balloons","banana","begin","behind","below","birthday","boat","brother","bubbles","bunny",
"cannot","change","chart","cherry","child","choose","circle","commas","cream","cry",
"cube","danger","date","detail","different","does","down","dragon","draw","drink",
"drive","duck","each","earth","easy","eat","echo","eight","elbow","English",
"shade","share","shows","simple","sizes","skate","skunk","sleep","small","smile",
"smooth","snack","snake","soapy","soil","solids","sound","vowel","evaporate","family",
"farmer","farther","fast","feet","fence","find","flower","freeze","friend","frog",
"front","funny","game","giant","gift","giggle","globe","goat","good","goose",
"great","green","grin","ground","group","guess","gym","habitat","hair","half",
"hamster","happen","happy","head","heard","held","here","hide","hobby","honey",
"hop","horse","hour","huge","hurt","hut","ice","ideas","tablet","tack",
"tactic","taffy","tailor","talent","tame","target","tasty","temple","tempo","tennis",
"tense","tepee","thigh","think","thirst","wage","igloo","inch","insects","inside",
"iron","itch","jail","jam","jelly","join","joke","jolly","judge","juggle",
"July","jungle","junk","keep","kettle","key","kick","kinds","kiss","kite",
"kitten","knife","lakes","lamb","lamp","land","laugh","lazy","lemon","letter",
"library","life","lift","lime","line","liquid","listen","liter","little","loud",
"love","lunch","machine","magic","magnet","umpire","unable","uncle","under","until",
"vague","vain","valor","value","vapor","vast","verbs","vest","vibrate","visit",
"voice","wagon","make","many","meal","might","Monday","money","monkey","mother",
"motor","mouse","mouth","move","much","music","near","neat","neck","needle",
"never","next","nickel","night","nine","noise","none","north","nose","notice",
"noun","number","oak","object","ocean","offer","office","once","one","onion",
"only","order","other","ounce","outside","oval","oven","over","owe","owl",
"page","pain","walk","warn","water","were","wheel","with","won","story",
"stove","summer","Sunday","suppose","sure","table","speak","special","stamp","store",
"paint","pair","palace","palm","paper","patch","peace","peach","peanut","pencil",
"penny","people","pepper","perfect","person","phone","pickles","picture","piece","pile",
"pilot","pine","places","plate","play","pretty","prize","puppet","puppy","purple",
"push","quart","queen","quiet","radio","raft","raise","rang","read","ready",
"really","repeat","return","reuse","rhyme","riddle","robot","sense","sentence","word",
"would","write","writer","year","your","time","tomorrow","tooth","town","tree",
"turtle","ugly","thirty","thorn","throb","throw","wait"
];

let used=[];
let currentWord="";
let currentPlayer=1;
let scores=[0,0];
let answered=false;

function spin(){

if(used.length===words.length){
alert("All words used");
return;
}

answered=false;

let index;
do{
index=Math.floor(Math.random()*words.length);
}while(used.includes(index));

used.push(index);

currentWord=words[index];

document.getElementById("word").innerText=currentWord;

}

function playAudio(){

speechSynthesis.cancel();

let u=new SpeechSynthesisUtterance(currentWord);
u.lang="en-US";
u.rate=0.65;
speechSynthesis.speak(u);

}

function correct(){

if(answered)return;

answered=true;

scores[currentPlayer-1]++;

updateScore();

}

function incorrect(){

if(answered)return;

answered=true;

updateScore();

}

function nextPlayer(){

currentPlayer=currentPlayer===1?2:1;

highlight();

}

function updateScore(){

document.getElementById("score1").innerText=
document.getElementById("player1").value+": "+scores[0];

document.getElementById("score2").innerText=
document.getElementById("player2").value+": "+scores[1];

}

function highlight(){

document.getElementById("score1").classList.remove("active");
document.getElementById("score2").classList.remove("active");

document.getElementById("score"+currentPlayer).classList.add("active");

}

function reset(){

scores=[0,0];
used=[];
updateScore();
document.getElementById("word").innerText="Press SPIN";

}

highlight();

</script>

</body>
</html>
