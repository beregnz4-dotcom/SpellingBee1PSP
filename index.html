<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Spelling Bee Contest</title>
  <style>
    :root{
      --bg1:#fff6dc; --bg2:#ffe7a6; --card:#ffffffcc;
      --text:#3b2b1f; --muted:#7b6a5c;
      --yellow:#f4b000; --yellow2:#eaa200;
      --purple:#7a4dff; --green:#27c36a; --red:#ff4b4b; --dark:#1f2430;
      --radius:22px;
      --shadow: 0 18px 40px rgba(0,0,0,.12);
      --shadow2: 0 10px 18px rgba(0,0,0,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 0%, var(--bg1), transparent 60%),
        radial-gradient(1200px 800px at 80% 0%, var(--bg2), transparent 60%),
        linear-gradient(#fff7e6, #fff2cf);
      min-height:100vh;
      padding: 18px 14px 40px;
    }
    .wrap{ max-width: 860px; margin: 0 auto; }

    .header{
      display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:14px 16px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
      box-shadow: var(--shadow2);
      border: 1px solid rgba(0,0,0,.06);
    }
    .title{
      display:flex; align-items:center; gap:10px;
      font-weight: 900; letter-spacing:.2px;
      font-size: 26px;
    }
    .bee{ font-size: 26px; }
    .sub{
      margin-top:6px;
      color:var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .chip{
      background: rgba(255,255,255,.9);
      border:1px solid rgba(0,0,0,.08);
      padding:10px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 6px 10px rgba(0,0,0,.08);
      cursor:pointer;
    }

    .grid{ margin-top:14px; display:grid; grid-template-columns: 1fr; gap:14px; }

    .panel{
      border-radius: var(--radius);
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panel .bar{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.6);
      font-weight:800;
      color: var(--muted);
      font-size: 13px;
      flex-wrap:wrap;
    }
    .content{ padding: 14px; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }

    .input{
      flex: 1;
      min-width: 190px;
      border-radius: 14px;
      border: 1px solid rgba(0,0,0,.12);
      padding: 12px 12px;
      font-size: 16px;
      background: rgba(255,255,255,.95);
      outline: none;
    }

    .btn{
      border: 0;
      border-radius: 16px;
      padding: 12px 14px;
      font-weight: 900;
      letter-spacing:.2px;
      cursor: pointer;
      box-shadow: var(--shadow2);
      transition: transform .06s ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn[disabled]{ opacity:.5; cursor:not-allowed; box-shadow:none; }

    .btn-yellow{ background: linear-gradient(180deg, var(--yellow), var(--yellow2)); color:#fff; }
    .btn-purple{ background: linear-gradient(180deg, #8b63ff, var(--purple)); color:#fff; }
    .btn-green{ background: linear-gradient(180deg, #34d97b, var(--green)); color:#fff; }
    .btn-red{ background: linear-gradient(180deg, #ff6a6a, var(--red)); color:#fff; }
    .btn-dark{ background: linear-gradient(180deg, #2a3242, var(--dark)); color:#fff; }
    .btn-ghost{
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(0,0,0,.10);
      color: var(--text);
      box-shadow:none;
    }

    .scoreTop{
      display:grid;
      grid-template-columns: repeat( auto-fit, minmax(190px, 1fr) );
      gap:12px;
      margin-top:12px;
    }
    .scoreCard{
      border-radius: 18px;
      padding: 12px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow2);
      position:relative;
      overflow:hidden;
      cursor:pointer;
    }
    .scoreName{ font-weight: 900; font-size: 16px; }
    .scorePts{ font-weight: 1000; font-size: 34px; margin-top:4px; }
    .turnBadge{
      position:absolute; right:10px; top:10px;
      background: linear-gradient(180deg, var(--yellow), var(--yellow2));
      color:#fff;
      font-weight: 1000;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      box-shadow: var(--shadow2);
      display:none;
    }
    .scoreCard.active .turnBadge{ display:inline-block; }

    .gameCard{
      margin-top: 12px;
      border-radius: 22px;
      background: rgba(255,255,255,.85);
      border: 1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      padding: 14px;
      text-align:center;
    }
    .labelSmall{ color: var(--muted); font-weight: 900; font-size: 12px; letter-spacing:.6px; }
    .speller{ font-weight: 1000; font-size: 22px; margin-top: 6px; }
    .word{
      font-weight: 1100;
      font-size: 56px;
      letter-spacing: .8px;
      margin: 10px 0 4px;
      color: #3a2419;
      word-break: break-word;
    }
    .hint{ color: var(--muted); font-weight: 700; font-size: 13px; margin-bottom: 10px; }

    .imgWrap{
      width: 100%;
      max-width: 360px;
      margin: 10px auto 12px;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 22px;
      padding: 12px;
      box-shadow: var(--shadow2);
    }
    .imgWrap img{
      width: 100%;
      height: auto;
      display:block;
      border-radius: 16px;
      background: #fff;
    }

    .audioWrap{
      max-width: 420px;
      margin: 8px auto 0;
      background: rgba(255,255,255,.9);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      padding: 10px;
      box-shadow: var(--shadow2);
      text-align:left;
    }
    .audioWrap .aLabel{
      font-size:12px;
      font-weight:900;
      color:var(--muted);
      margin-bottom:6px;
    }
    audio{ width:100%; }

    .btnGrid{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      max-width: 420px;
      margin: 12px auto 0;
    }

    .btnRow2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }

    .footerRow{
      display:flex; gap:10px; flex-wrap:wrap; justify-content:center;
      margin-top: 12px;
    }

    .toast{
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      min-height: 18px;
    }

    .spinAnim{ animation: spinPulse .65s ease-in-out; }
    @keyframes spinPulse{
      0%{ transform: scale(1); filter: blur(0px); opacity: 1;}
      35%{ transform: scale(1.02); filter: blur(1px); opacity: .85;}
      70%{ transform: scale(.99); filter: blur(0px); opacity: 1;}
      100%{ transform: scale(1); }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title"><span class="bee">🐝</span> Spelling Bee Contest</div>
        <div class="sub">No repeats until reset • You control the turn • Auto-save</div>
      </div>
      <button class="chip" id="hardResetBtn" title="Delete all saved progress and start fresh">Hard Reset</button>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="bar">
          <div>Players & Progress</div>
          <div>
            <span id="remainingTxt">Remaining: 337</span>
            &nbsp; • &nbsp;
            <span id="roundTxt">Used: 0 / 337</span>
          </div>
        </div>

        <div class="content">
          <div class="row">
            <input class="input" id="playerName" placeholder="Player name (Aitana, Pedro…)" />
            <button class="btn btn-yellow" id="addPlayerBtn">Add Player</button>
            <button class="btn btn-ghost" id="startBtn">Start / Resume</button>
          </div>

          <div class="scoreTop" id="scoreTop"></div>

          <div class="gameCard" id="gameCard" style="display:none;">
            <div class="labelSmall">ACTIVE SPELLER</div>
            <div class="speller" id="activeSpeller">—</div>

            <div class="word" id="wordTxt">Press SPIN</div>
            <div class="hint" id="hintTxt">Tip: SPIN chooses a new unused word.</div>

            <div class="imgWrap">
              <img id="wordImg" src="img/placeholder.png" alt="word image" />
            </div>

            <div class="audioWrap">
              <div class="aLabel">AUDIO (MP3) — tap PLAY (iPhone)</div>
              <audio id="audioPlayer" controls preload="none">
                <source id="audioSource" src="" type="audio/mpeg">
              </audio>
            </div>

            <div class="btnGrid">
              <button class="btn btn-yellow" id="spinBtn">🎡 SPIN WORD!</button>
              <button class="btn btn-purple" id="playBtn">🔊 PLAY AUDIO</button>

              <div class="btnRow2">
                <button class="btn btn-green" id="correctBtn" disabled>✅ CORRECT</button>
                <button class="btn btn-red" id="wrongBtn" disabled>❌ WRONG</button>
              </div>

              <div class="btnRow2">
                <button class="btn btn-dark" id="nextPlayerBtn">NEXT PLAYER</button>
                <button class="btn btn-ghost" id="resetRoundBtn">Reset Round</button>
              </div>
            </div>

            <div class="footerRow">
              <button class="btn btn-ghost" id="resetScoresBtn">Reset Scores</button>
            </div>

            <div class="toast" id="toast"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

const el = (id)=>document.getElementById(id);
const playerName = el("playerName");
const addPlayerBtn = el("addPlayerBtn"); const startBtn = el("startBtn"); const scoreTop = el("scoreTop"); const gameCard = el("gameCard"); const activeSpeller = el("activeSpeller"); const wordTxt = el("wordTxt"); const hintTxt = el("hintTxt"); const wordImg = el("wordImg"); const remainingTxt = el("remainingTxt"); const roundTxt = el("roundTxt"); const spinBtn = el("spinBtn"); const playBtn = el("playBtn"); const correctBtn = el("correctBtn"); const wrongBtn = el("wrongBtn"); const nextPlayerBtn = el("nextPlayerBtn"); const resetRoundBtn = el("resetRoundBtn"); const resetScoresBtn = el("resetScoresBtn"); const hardResetBtn = el("hardResetBtn"); const toast = el("toast");

const audioPlayer = el("audioPlayer");
const audioSource = el("audioSource");

/* ====== STATE ====== */
let state = {
  players: [],                // [{name, score}]
  active: 0,                  // active player index
  remaining: [],              // indexes not used yet
  used: [],                   // indexes used
  currentIdx: null,           // current word index
  scoredThisWord: false,       // prevents double scoring
  started: false
};

/* ====== SAVE/LOAD ====== */
function save(){
  localStorage.setItem(LS_KEY, JSON.stringify(state)); } function load(){
  const raw = localStorage.getItem(LS_KEY);
  if(!raw) return false;
  try{
    const obj = JSON.parse(raw);
    if(!obj || !Array.isArray(obj.players)) return false;
    state = obj;
    return true;
  }catch(e){
    return false;
  }
}
function hardReset(){
  localStorage.removeItem(LS_KEY);
  state = {
    players: [],
    active: 0,
    remaining: [],
    used: [],
    currentIdx: null,
    scoredThisWord: false,
    started: false
  };
  renderAll();
}
function initRound(){
  state.remaining = Array.from({length: WORDS.length}, (_,i)=>i);
  state.used = [];
  state.currentIdx = null;
  state.scoredThisWord = false;
  state.started = true;
  save();
}

/* ====== UI ====== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, (m)=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function renderPlayers(){
  scoreTop.innerHTML = "";
  if(state.players.length === 0){
    scoreTop.innerHTML = `<div class="toast">Add players (Aitana, Pedro…) then tap “Start / Resume”.</div>`;
    return;
  }

  state.players.forEach((p, idx)=>{
    const div = document.createElement("div");
    div.className = "scoreCard" + (idx===state.active ? " active" : "");
    div.innerHTML = `
      <div class="turnBadge">TURN</div>
      <div class="scoreName">${escapeHtml(p.name)}</div>
      <div class="scorePts">${p.score}</div>
    `;

    // Tap a player card to edit name (optional but helpful)
    div.addEventListener("click", ()=>{
      const newName = prompt("Edit player name:", p.name);
      if(newName === null) return;
      const t = newName.trim();
      if(!t) return;
      state.players[idx].name = t;
      save();
      renderAll();
    });

    scoreTop.appendChild(div);
  });
}

function renderProgress(){
  const rem = Array.isArray(state.remaining) ? state.remaining.length : WORDS.length;
  const used = Array.isArray(state.used) ? state.used.length : 0;
  remainingTxt.textContent = `Remaining: ${rem}`;
  roundTxt.textContent = `Used: ${used} / ${WORDS.length}`; }

function setImage(key){
  const src = `img/${key}.png`;
  wordImg.onerror = () => {
    wordImg.onerror = null;
    wordImg.src = "img/placeholder.png";
  };
  wordImg.src = src;
}

function setAudio(key){
  // Loads MP3 into the audio controls (mobile-friendly)
  const src = `audio/${key}.mp3`;
  audioSource.src = src;
  audioPlayer.load();
}

function toastMsg(msg){
  toast.textContent = msg || "";
}

function renderGame(){
  const hasPlayers = state.players.length > 0;
  gameCard.style.display = hasPlayers ? "block" : "none";
  if(!hasPlayers) return;

  activeSpeller.textContent = state.players[state.active]?.name ?? "—";

  if(state.currentIdx === null){
    wordTxt.textContent = "Press SPIN";
    hintTxt.textContent = "SPIN chooses a new unused word.";
    setImage("placeholder");
    audioSource.src = "";
    audioPlayer.load();
    correctBtn.disabled = true;
    wrongBtn.disabled = true;
    return;
  }

  const w = WORDS[state.currentIdx];
  wordTxt.textContent = w.display;
  hintTxt.textContent = state.scoredThisWord
    ? "Recorded ✅ Spin to get the next word."
    : "Tap PLAY AUDIO, then choose CORRECT or WRONG.";

  setImage(w.key);
  setAudio(w.key);

  // scoring enabled only once per word (until next SPIN)
  correctBtn.disabled = state.scoredThisWord;
  wrongBtn.disabled = state.scoredThisWord; }

function renderAll(){
  renderPlayers();
  renderProgress();
  renderGame();
}

/* ====== GAME LOGIC ====== */
function pickNextWord(){
  if(!Array.isArray(state.remaining) || state.remaining.length === 0){
    toastMsg("Round finished ✅ Tap “Reset Round” to start over.");
    state.currentIdx = null;
    state.scoredThisWord = false;
    save();
    renderAll();
    return;
  }

  const r = Math.floor(Math.random() * state.remaining.length);
  const idx = state.remaining.splice(r,1)[0];
  state.used.push(idx);
  state.currentIdx = idx;
  state.scoredThisWord = false;
  save();
  renderAll();
}

function score(isCorrect){
  if(state.currentIdx === null) return;
  if(state.scoredThisWord) return; // prevents double scoring

  if(isCorrect){
    state.players[state.active].score += 1;
    toastMsg("✅ Correct recorded.");
  } else {
    toastMsg("❌ Wrong recorded.");
  }

  state.scoredThisWord = true; // lock until next SPIN
  save();
  renderAll();
}

function nextPlayer(){
  if(state.players.length === 0) return;
  state.active = (state.active + 1) % state.players.length;
  toastMsg(`Now it’s ${state.players[state.active].name}’s turn!`);
  save();
  renderAll();
}

/* ====== AUDIO PLAY (MP3 + fallback TTS) ====== */ let chosenVoice = null; function pickVoice(){
  const voices = speechSynthesis.getVoices?.() || [];
  const preferred =
    voices.find(v => /en-US/i.test(v.lang) && /Siri|Enhanced|Google|Alex/i.test(v.name)) ||
    voices.find(v => /en-US/i.test(v.lang)) ||
    voices.find(v => /en-GB/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) ||
    voices[0] || null;
  chosenVoice = preferred;
}
if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged = pickVoice;
  pickVoice();
}
function speakFallback(word){
  if(!("speechSynthesis" in window)) return;
  try{
    speechSynthesis.cancel();
    const ut = new SpeechSynthesisUtterance(word);
    ut.lang = "en-US";
    if(chosenVoice) ut.voice = chosenVoice;
    ut.rate = 0.72; // clearer for kids
    ut.pitch = 1.0;
    ut.volume = 1.0;
    speechSynthesis.speak(ut);
  }catch(e){}
}

function playAudio(){
  if(state.currentIdx === null) return;
  const w = WORDS[state.currentIdx];

  // Try MP3 first
  const src = `audio/${w.key}.mp3`;
  audioSource.src = src;
  audioPlayer.load();

  audioPlayer.play().then(()=>{
    toastMsg("");
  }).catch(()=>{
    // If autoplay blocked or file missing, fallback to TTS
    toastMsg("If MP3 didn’t play, tap the ▶️ on the audio bar. (Fallback voice will speak now.)");
    speakFallback(w.display.toLowerCase());
  });
}

/* ====== EVENTS ====== */
addPlayerBtn.addEventListener("click", ()=>{
  const name = (playerName.value || "").trim();
  if(!name) return;
  state.players.push({name, score:0});
  playerName.value = "";
  if(state.players.length === 1) state.active = 0;
  save();
  renderAll();
});

startBtn.addEventListener("click", ()=>{
  if(state.players.length === 0){
    toastMsg("Add at least 1 player first.");
    return;
  }
  if(!state.started || !Array.isArray(state.remaining) || (state.remaining.length===0 && (state.used?.length||0)===0)){
    initRound();
  } else {
    state.started = true;
    save();
  }
  toastMsg("Ready ✅ Tap SPIN.");
  renderAll();
});

spinBtn.addEventListener("click", ()=>{
  if(state.players.length === 0){
    toastMsg("Add players first.");
    return;
  }
  if(!state.started) initRound();

  gameCard.classList.remove("spinAnim");
  void gameCard.offsetWidth;
  gameCard.classList.add("spinAnim");

  pickNextWord();

  // iPhone: do NOT rely on autoplay; but we can try to start it
  setTimeout(()=>{ /* optional attempt */ }, 120); });

playBtn.addEventListener("click", ()=> playAudio()); correctBtn.addEventListener("click", ()=> score(true)); wrongBtn.addEventListener("click", ()=> score(false)); nextPlayerBtn.addEventListener("click", ()=> nextPlayer());

resetRoundBtn.addEventListener("click", ()=>{
  if(!confirm("Reset the round (words start over, no repeats again)?")) return;
  initRound();
  toastMsg("Round reset ✅ Tap SPIN.");
  save();
  renderAll();
});

resetScoresBtn.addEventListener("click", ()=>{
  if(!confirm("Reset all scores to 0?")) return;
  state.players = state.players.map(p=>({name:p.name, score:0}));
  toastMsg("Scores reset ✅");
  save();
  renderAll();
});

hardResetBtn.addEventListener("click", ()=>{
  if(!confirm("Hard Reset deletes players, scores, saved progress. Continue?")) return;
  hardReset();
});

/* ====== BOOT ====== */
load();
if(!Array.isArray(state.remaining) || (!state.started && state.players.length===0)){
  // okay
}
renderAll();
toastMsg("Tip: Make sure your images are in /img and audio in /audio (lowercase)."); </script> </body> </html>
